exp_name: cifar10_labelskew_param_fedavg
output_dir: outputs

hardware:
  device: auto
  gpu_id: 0

dataset:
  name: cifar10
  data_root: ./data
  num_classes: 10
  in_channels: 3

model:
  name: resnet18
  pretrained: true
  num_classes: 10

federated:
  num_clients: 20
  participation_rate: 1.0
  one_shot: true
  non_iid:
    type: label
    alpha: 0.1

train:
  local_epochs: 20
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  momentum: 0.9
  label_smoothing: 0.0
  data_augmentation:
    enabled: false

method:
  name: param_fedavg
  family: parameter

  meta_init:
    enabled: false

  local_train:
    proximal_enabled: false
    prox_mu: 0.0
    train_head_only: false

  calibration:
    enabled: false

  fedavg:
    agg_lr: 1.0

representation:
  train_encoder: true
  freeze_backbone_bn: true

monitoring:
  verbose_partition: true

seeds: [42, 52, 62]