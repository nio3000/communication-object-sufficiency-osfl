dataset:
  name: pathmnist
  data_root: ./data
  num_classes: 9
model:
  name: resnet18
federated:
  num_clients: 20
  non_iid:
    type: quantity
    alpha_q: 1.0
method:
  name: pathmnist_quantityskew_parameter_fedavg
  family: parameter
  fedavg:
    agg_lr: 1.0
