exp_name: pathmnist_quantityskew_parameter_fedavg
seed: 42
seeds:
- 42
- 52
- 62
hardware:
  device: auto
  gpu_id: 0
train:
  batch_size: 128
  local_epochs: 20
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  label_smoothing: 0.0
  data_augmentation:
    enabled: false
monitoring:
  verbose_partition: false
