exp_name: cifar10_labelskew_msco_o3_diag_gaussian
output_dir: outputs

hardware:
  device: auto
  gpu_id: 0

dataset:
  name: cifar10
  data_root: ./data
  num_classes: 10
  in_channels: 3

model:
  name: resnet18
  pretrained: true
  num_classes: 10

federated:
  num_clients: 20
  participation_rate: 1.0
  one_shot: true
  non_iid:
    type: label
    alpha: 0.1

train:
  batch_size: 64
  local_epochs: 0
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  momentum: 0.9
  label_smoothing: 0.0
  data_augmentation:
    enabled: false

method:
  name: msco_o3_diag_gaussian
  family: msco

  meta_init:
    enabled: false

  msco:
    object_level: O3
    head_type: diag_gaussian
    shrinkage: 0.15
    diag_floor: 1.0e-4
    eps: 1.0e-6
    prior_temperature: 1.0
    max_stats_samples:
    refine:
      enabled: false

representation:
  local_adaptation: none
  extract_after_local_train: false
  freeze_backbone_bn: true

monitoring:
  verbose_partition: true

seeds: [42, 52, 62]