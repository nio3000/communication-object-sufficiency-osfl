exp_name: dermamnist_labelskew_parameter_fedavg
seed: 42
seeds:
- 42
- 52
- 62
hardware:
  device: auto
  gpu_id: 0
train:
  batch_size: 128
  local_epochs: 20
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  label_smoothing: 0.0
  data_augmentation:
    enabled: true
    random_horizontal_flip: 0.5
    random_rotation: 10
    color_jitter: 0.0
    random_affine: 0.0
monitoring:
  verbose_partition: false
output_dir: outputs/dermamnist_labelskew_parameter_fedavg
dataset:
  name: dermamnist
  data_root: ./data
  num_classes: 7
model:
  name: resnet18
federated:
  num_clients: 20
  non_iid:
    type: label
    alpha: 0.1
method:
  name: dermamnist_labelskew_parameter_fedavg
  family: parameter
  fedavg:
    agg_lr: 1.0
